name: CD Pipeline

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools==69.5.1 wheel
          pip install numpy==1.26.2
          pip install scikit-surprise==1.1.3 --no-build-isolation --no-deps
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate data before training
        run: pytest tests/data/ -v

      - name: Train model
        run: echo y | python scripts/train_model.py

      - name: Run release tests
        run: pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: release-model
          path: models/svd_model.pkl
          if-no-files-found: error

  build-and-push:
    name: Build and Push Versioned Image
    runs-on: ubuntu-latest
    needs: [validate]
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Validate Docker Hub secrets
        run: |
          test -n "$DOCKER_USERNAME"
          test -n "$DOCKER_PASSWORD"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: release-model
          path: models

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/movie-rating-api:${{ github.ref_name }}

  deploy-staging:
    name: Verify Staging Image
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: staging
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      IMAGE_TAG: ${{ github.ref_name }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Start versioned image
        run: |
          docker pull "$DOCKER_USERNAME/movie-rating-api:$IMAGE_TAG"
          docker run -d -p 8000:8000 --name staging-api "$DOCKER_USERNAME/movie-rating-api:$IMAGE_TAG"

      - name: Verify staging health
        run: |
          for attempt in {1..30}; do
            if health_response=$(curl --fail --silent http://localhost:8000/health); then
              if python -c 'import json, sys; assert json.loads(sys.argv[1]) == {"status": "healthy", "model_loaded": True}' "$health_response"; then
                echo "$health_response"
                exit 0
              fi
            fi
            echo "API is not ready yet ($attempt/30)"
            sleep 2
          done
          docker logs staging-api
          exit 1

      - name: Stop staging container
        if: always()
        run: docker rm -f staging-api

  deploy-production:
    name: Promote and Verify Production Image
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: production
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      IMAGE_TAG: ${{ github.ref_name }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Promote version to latest
        run: >-
          docker buildx imagetools create
          --tag "$DOCKER_USERNAME/movie-rating-api:latest"
          "$DOCKER_USERNAME/movie-rating-api:$IMAGE_TAG"

      - name: Start production image
        run: |
          docker pull "$DOCKER_USERNAME/movie-rating-api:latest"
          docker run -d -p 8000:8000 --name production-api "$DOCKER_USERNAME/movie-rating-api:latest"

      - name: Verify production health
        run: |
          for attempt in {1..30}; do
            if health_response=$(curl --fail --silent http://localhost:8000/health); then
              if python -c 'import json, sys; assert json.loads(sys.argv[1]) == {"status": "healthy", "model_loaded": True}' "$health_response"; then
                echo "$health_response"
                exit 0
              fi
            fi
            echo "API is not ready yet ($attempt/30)"
            sleep 2
          done
          docker logs production-api
          exit 1

      - name: Stop production container
        if: always()
        run: docker rm -f production-api

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [deploy-production]
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
