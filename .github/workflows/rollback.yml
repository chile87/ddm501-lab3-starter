name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing version tag to promote again, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Promote Previous Version
    runs-on: ubuntu-latest
    environment: production
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Validate inputs and secrets
        run: |
          [[ "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          test -n "$DOCKER_USERNAME"
          test -n "$DOCKER_PASSWORD"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Verify rollback image exists
        run: docker buildx imagetools inspect "$DOCKER_USERNAME/movie-rating-api:$IMAGE_TAG"

      - name: Promote rollback image to latest
        run: >-
          docker buildx imagetools create
          --tag "$DOCKER_USERNAME/movie-rating-api:latest"
          "$DOCKER_USERNAME/movie-rating-api:$IMAGE_TAG"

      - name: Start rollback image
        run: |
          docker pull "$DOCKER_USERNAME/movie-rating-api:latest"
          docker run -d -p 8000:8000 --name rollback-api "$DOCKER_USERNAME/movie-rating-api:latest"

      - name: Verify rollback health
        run: |
          for attempt in {1..30}; do
            if health_response=$(curl --fail --silent http://localhost:8000/health); then
              if python -c 'import json, sys; assert json.loads(sys.argv[1]) == {"status": "healthy", "model_loaded": True}' "$health_response"; then
                echo "$health_response"
                exit 0
              fi
            fi
            echo "API is not ready yet ($attempt/30)"
            sleep 2
          done
          docker logs rollback-api
          exit 1

      - name: Stop rollback container
        if: always()
        run: docker rm -f rollback-api
